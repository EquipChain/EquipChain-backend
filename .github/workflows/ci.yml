name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per ref: a fast follow-up push cancels the superseded run instead
# of queueing behind it. Without this, three pushes in a minute means three
# full test matrices running sequentially on shared runners - and the first
# two results are for commits that are already stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      # Commit-pinned instead of tag-pinned: tags are mutable, SHAs are not.
      # A compromised upstream action repository cannot retroactively inject
      # code into our workflow; dependabot keeps the SHAs current.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d611fceb7bbdac9c6473 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npx eslint src/ scripts/ index.js
      - name: Test
        # Explicit strong secret: exercises the production JWT policy path
        # (secret required, >= 32 chars) on every CI run, so a regression
        # that lets weak/missing secrets boot in production fails here.
        env:
          JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
          NODE_ENV: test
        run: npm test

  audit:
    # Advisory job: reports known vulnerabilities in dependencies without
    # blocking the pipeline (production deps only; dev-only advisories are
    # expected noise). Escalate to blocking by removing the continue-on-error.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d611fceb7bbdac9c6473 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    # Build the production image on every PR AND on pushes to main. The
    # original PR-only gate missed the case that actually bit this repo: a
    # Dockerfile or entry-point regression can land on main (where the image
    # is what gets deployed) with no PR in between - the boot-crash fix in
    # this repo's history is exactly such a regression. The image is still
    # not pushed from CI; this is a build gate, not a release pipeline.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Build production image
        run: docker build --target production -t equipchain-backend:ci .
